[package]
name = "speed-test-rust-server"
version = "1.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time"] }
tokio-tungstenite = "0.26"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde_json = "1"
libc = "0.2.190"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
